<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>koreaciv — 대한민국 전략 지도</title>
  <meta name="description" content="대한민국을 4X 전략 게임 헥스 지도로. 모든 숫자는 공공데이터에서 나온다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%23d8b25a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading">지도를 펼치는 중…</div>
  <canvas id="map" aria-label="대한민국 헥스 지도"></canvas>
  <header id="topbar"></header>
  <aside id="panel" hidden></aside>
  <div id="legend"></div>
  <div id="layerctl"></div>
  <nav id="lensbar" aria-label="렌즈 선택"></nav>
  <div id="minimap"><canvas aria-label="미니맵"></canvas></div>
  <div id="tooltip" hidden></div>
  <div id="search" hidden></div>
  <div id="almanac" hidden></div>
  <section id="report" hidden aria-label="순위 보고서"></section>
  <div id="help" hidden></div>
  <div id="sharemenu" hidden></div>
  <div id="pngpreview" hidden></div>
  <div id="fnpop" hidden role="note"></div>
  <div id="toast" hidden role="status"></div>
  <div id="loadwarn" hidden role="alert"></div>
  <div id="a11y-status" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
